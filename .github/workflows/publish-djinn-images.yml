name: Publish Djinn Novu images

on:
  push:
    branches:
      - djinn/v3.19.0
  workflow_dispatch:

concurrency:
  group: publish-djinn-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/gotovchenkoai/novu

jobs:
  build:
    name: ${{ matrix.service }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, ws, dashboard]
        arch:
          - { name: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { name: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-space
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Install root tooling for the build context
        if: matrix.service != 'dashboard'
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.arch.platform }}
          ARCH: ${{ matrix.arch.name }}
        run: |
          set -eu
          image="${IMAGE_PREFIX}-${SERVICE}"
          common=(
            --platform "$PLATFORM"
            --cache-from "type=gha,scope=${SERVICE}-${ARCH}"
            --cache-to "type=gha,mode=max,scope=${SERVICE}-${ARCH}"
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --output "type=image,name=${image},push-by-digest=true,name-canonical=true,push=true"
            --provenance=false
            --metadata-file meta.json
          )
          if [ "$SERVICE" = dashboard ]; then
            docker buildx build "${common[@]}" --build-arg VITE_SELF_HOSTED=true -f apps/dashboard/dockerfile .
          else
            # pnpm-context кончает кодом 13 (незавершённый await в конце потока), важен код сборки.
            pnpm --silent --workspace-root pnpm-context -- "apps/${SERVICE}/Dockerfile" \
              | docker buildx build "${common[@]}" --build-arg "PACKAGE_PATH=apps/${SERVICE}" -
          fi
          digest="$(jq -r '."containerimage.digest"' meta.json)"
          mkdir -p digests
          touch "digests/${digest#sha256:}"
          echo "${SERVICE} ${ARCH} ${digest}"

      - name: Export the arm64 image for a local check
        if: github.event_name == 'workflow_dispatch' && matrix.arch.name == 'arm64'
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch.name }}
        run: |
          set -eu
          export_args=(
            --platform linux/arm64
            --cache-from "type=gha,scope=${SERVICE}-${ARCH}"
            --output "type=docker,dest=image.tar,name=ghcr.io/gotovchenkoai/novu-${SERVICE}:local"
          )
          if [ "$SERVICE" = dashboard ]; then
            docker buildx build "${export_args[@]}" --build-arg VITE_SELF_HOSTED=true -f apps/dashboard/dockerfile .
          else
            pnpm --silent --workspace-root pnpm-context -- "apps/${SERVICE}/Dockerfile" \
              | docker buildx build "${export_args[@]}" --build-arg "PACKAGE_PATH=apps/${SERVICE}" -
          fi

      - name: Upload the arm64 image
        if: github.event_name == 'workflow_dispatch' && matrix.arch.name == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-arm64
          path: image.tar
          compression-level: 1
          retention-days: 2

      - name: Keep the digest for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch.name }}
          path: digests/*
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, ws, dashboard]
    steps:
      - name: Fetch digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tags and report the digest
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          image="${IMAGE_PREFIX}-${SERVICE}"
          sources=()
          for digest in digests/*; do sources+=("${image}@sha256:$(basename "$digest")"); done
          docker buildx imagetools create -t "${image}:sha-${GITHUB_SHA}" -t "${image}:latest" "${sources[@]}"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' > manifest.json
          digest="$(jq -r '.digest' manifest.json)"
          {
            echo "### ${SERVICE}"
            echo
            echo "- Tag: \`${image}:sha-${GITHUB_SHA}\`"
            echo "- Deploy reference: \`${image}@${digest}\`"
            jq -r '.manifests[] | "- \(.platform.architecture): `\(.digest)`"' manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${image}@${digest}"
